{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{% static 'platformpathapp/css/station_map.css' %}">
</head>

<body>
	<!-- ================= HEADER (fixed / absolutely positioned nav bar) ================= -->
	<header class="site-header">
		<div class="site-header__inner">
			<a class="brand" href="#">
					<img class="brand__logo" src="{% static 'platformpathapp/decals/mta_logo.png' %}" alt="MTA logo big">
					<span class="brand__name">PLATFORMPATH</span>
			</a>
			<nav class="site-header__nav">
					<a href="/not-found">ABOUT US</a>
					<a href="/">HOME</a>
					<a href="/not-found">NAVIGATE</a>
			</nav>
		</div>
		<button class="site-header__toggle-button">
			<img 
				class="toggle-button__animated-parts-img"
				src="{% static 'platformpathapp/decals/site_header_toggle_button_animated_parts.svg' %}" 
				alt="Site header toggle button icon animated parts">
			<img 
				class="toggle-button__base-img"
				src="{% static 'platformpathapp/decals/site_header_toggle_button_base.svg' %}" 
				alt="Site header toggle button icon base">
		</button>
	</header>

	<main class="station-map-page">
		<section class="station-map-stage" aria-label="Station map">

			<!-- ================= STATION DIAGRAM CONTAINER ================= -->
			<div class="diagram-container" id="diagram-container">
					<!-- SVG loads here -->
			</div>

			<header class="map-overlay map-header">
				<h1 id="diagram-name"></h1>
			</header>

			<!-- ================= LAYERS/LEVELS VIEW TOGGLE ================= -->
			<aside class="map-overlay level-stack" aria-label="Map view toggles">
				<button id="show-all-layers" class="all-layers-button active" type="button">
					SHOW ALL LEVELS
				</button>
				
				<div class="level-rail">
					<p class="level-boundary">TOP LEVEL ↑</p>
					<div id="layer-options" class="layer-options"></div>
					<p class="level-boundary">BOTTOM LEVEL ↓</p>
				</div>
			</aside>

			<!-- ================= ROUTE FORM (PATH FINDING) + FILTER CHECKLIST ================= -->
			<div class="map-overlay route-form-filter-checklist__container">
				<div class="filter-checklist" aria-label="Filters toggle">
					<div class="filter-checklist__checkboxes-container hidden"></div>
					<button class="filter-checklist__toggle-button">
						<img src="{% static 'platformpathapp/decals/dropdown_arrow_reversed_logo.svg' %}" alt="Toggle button icon">
						SELECT FILTERS
					</button>
				</div>
				<div id="route-form" class="route-form" aria-label="Nodes selection">
					<div class="route-field">
						<button class="route-form__button route-field__dropdown-button" popovertarget="start-node-dropdown">START</button>
						<div id="start-node-dropdown" class="route-field__dropdown" popover></div>
					</div>

					<div class="route-field">
						<button class="route-form__button route-field__dropdown-button" popovertarget="end-node-dropdown">END</button>
						<div id="end-node-dropdown" class="route-field__dropdown" popover></div>
					</div>

					<button class="route-form__button route-form__find-route-button" id="find-route" type="button">FIND ROUTE</button>
				</div>
			</div>
			<!-- ================= ROUTE PREVIEW ================= -->
			<div
				id="route-preview"
				class="map-overlay route-preview"
				style="display: none;"
				aria-label="Route preview"
			>
				<strong>Route preview</strong>
				<span id="route-preview-summary"></span>

				<div class="route-preview__controls">
					<button id="start-navigation" type="button">
						Start Navigation
					</button>

					<button id="cancel-route-preview" type="button">
						Change Route
					</button>
				</div>
			</div>
			<!-- ================= STEP UI BLOCK ================= -->
			<div id="step-ui" class="map-overlay step-ui" style="display: none;" aria-label="Steps Instructions/Buttons">
				<strong class="step-ui__instruction-text" id="instruction-text">Instructions will appear here</strong>
				<div class="step-ui__step-controls">
					<button id="btn-prev" type="button">Previous</button>
					<button id="btn-next" type="button">Next</button>
				</div>
			</div>

			<!-- ================= MAP ROTATE BUTTON ================= -->
			<button class="map-overlay map__rotate-button">
				<img 
					class="rotate-button__animated-parts-img" 
					src="{% static 'platformpathapp/decals/map_rotate_button_animated_parts.svg' %}" 
					alt="Rotate map button icon animated parts"
				>
				<img 
					class="rotate-button__base-img" 
					src="{% static 'platformpathapp/decals/map_rotate_button_base.svg' %}" 
					alt="Rotate map button icon base"
				>
			</button>
		</section>
	</main>

	<!-- ================= FOOTER ================= -->
	<footer class="site-footer">
		<div class="brand brand--footer">
			<img class="brand__logo brand__logo--sm" src="{% static 'platformpathapp/decals/mta_logo.png' %}" alt="MTA logo small">
			<span class="brand__name brand__name--sm">PLATFORMPATH</span>
		</div>
		<div class="site-footer__legal">
			<span>2026 All rights reserved.</span>
			<span class="site-footer__disclaimer">DISCLAIMER: Maps are not 100% accurate and are subject to updates.</span>
		</div>
	</footer>

	<script src="https://unpkg.com/panzoom@9.4.0/dist/panzoom.min.js"></script>
	<script type="module" src="{% static 'platformpathapp/js/app.js' %}"></script>

</body>

</html>
